<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>InventoryHub</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <header>
    <h1>InventoryHub</h1>
    <p id="status" role="status" aria-live="polite"></p>
  </header>

  <main>
    <section aria-labelledby="list-heading">
      <h2 id="list-heading">Inventory items</h2>
      <form id="search-form" class="toolbar" aria-label="Search inventory">
        <label for="search">Search</label>
        <input id="search" name="search" type="search" placeholder="name, SKU, location" />
        <label for="limit">Per page</label>
        <select id="limit" name="limit">
          <option value="5">5</option>
          <option value="10" selected>10</option>
          <option value="25">25</option>
        </select>
        <button type="submit">Apply</button>
      </form>

      <table aria-describedby="list-heading">
        <thead>
          <tr>
            <th scope="col">Name</th>
            <th scope="col">SKU</th>
            <th scope="col">Qty</th>
            <th scope="col">Location</th>
            <th scope="col">Updated</th>
            <th scope="col">Actions</th>
          </tr>
        </thead>
        <tbody id="items-body"></tbody>
      </table>

      <nav class="pagination" aria-label="Pagination">
        <button id="prev">Prev</button>
        <span id="page-indicator">Page 1</span>
        <button id="next">Next</button>
      </nav>
    </section>

    <section aria-labelledby="create-heading">
      <h2 id="create-heading">Add item</h2>
      <form id="create-form" aria-label="Create item">
        <label for="name">Name</label>
        <input id="name" name="name" required />

        <label for="sku">SKU</label>
        <input id="sku" name="sku" required />

        <label for="quantity">Quantity</label>
        <input id="quantity" name="quantity" type="number" min="0" value="0" required />

        <label for="location">Location</label>
        <input id="location" name="location" required />

        <button type="submit">Create</button>
      </form>
    </section>
  </main>

  <footer>
    <small>&copy; InventoryHub</small>
  </footer>

  <script src="app.js" defer></script>
</body>
</html>
